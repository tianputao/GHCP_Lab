name: GHCP Lab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-all-labs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python workspace dependencies
        run: uv sync --all-packages --locked

      - name: Verify all labs and SDD comparison suite
        run: uv run ghcp-lab verify
