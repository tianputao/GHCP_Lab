[project]
name = "lab01-agent-plan-and-autopilot"
version = "2.0.0"
description = "Lab 01: Plan Mode, Agent Mode, Autopilot, Task-Aware Auto, Copilot CLI & Cloud Agent (Python + FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "."
