[project]
name = "lab05-enterprise-governance-and-capstone"
version = "2.0.0"
description = "Lab 05: Enterprise Governance, Content Exclusions, GitHub AI Credits Optimization & Full Capstone API (Python + FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "."
